<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DoorDash Google Form Compact Test V13</title>
<style>body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f7f7f8;margin:0;padding:32px;color:#191919}.card{max-width:720px;margin:auto;background:#fff;border:1px solid #e6e7ea;border-radius:18px;padding:24px;box-shadow:0 8px 22px rgba(0,0,0,.08)}button{border:0;border-radius:999px;background:#eb1700;color:white;font-weight:800;padding:12px 18px;cursor:pointer}.muted{color:#62666d}</style></head>
<body><div class="card"><h1>Google Form compact submission test</h1><p class="muted">This sends one fake compact payload to the same Google Form. If it works, Google Forms should show the official confirmation page and the linked Sheet should receive one row.</p><button id="send">Submit compact test response</button></div>
<script>
const ACTION='https://docs.google.com/forms/d/e/1FAIpQLSdS-hfITYEsiq96LNjHhpDFOT7GaMCUsrt6anSdXL998mZVIA/formResponse';
const E={backendVersion:'entry.944347711',securityToken:'entry.2043209587',attemptId:'entry.1826776542',source:'entry.1792796140',moduleSlug:'entry.1820527432',module:'entry.683106474',amName:'entry.2039635815',cohort:'entry.477605573',trainer:'entry.1645887859',assessmentDate:'entry.2083282923',submittedAt:'entry.2140637666',score:'entry.1709185299',passingThreshold:'entry.1442687625',passed:'entry.944274808',criticalFlagsCount:'entry.1208454027',scoreBand:'entry.97639594',strongAreas:'entry.130970967',focusAreas:'entry.1489959066',payloadChunk01:'entry.804381449',payloadChunk02:'entry.750243362',payloadChunk03:'entry.1436720290',payloadChunk04:'entry.558210288',payloadChunk05:'entry.2021021047',payloadChunk06:'entry.1459123753',payloadChunk07:'entry.492585984',payloadChunk08:'entry.1033992862',payloadChunk09:'entry.36563253',payloadChunk10:'entry.592336073',payloadChunk11:'entry.1658021750',payloadChunk12:'entry.1341339611'};
function chunkText(t,size,max){const chunks=[];const s=String(t||'');for(let i=0;i<max;i++){chunks.push(s.slice(i*size,(i+1)*size));}return chunks;}
function post(fields){const form=document.createElement('form');form.method='POST';form.action=ACTION;form.target='_self';form.enctype='application/x-www-form-urlencoded';form.acceptCharset='UTF-8';form.style.display='none';function add(name,val){const input=document.createElement('textarea');input.name=name;input.value=String(val??'');form.appendChild(input);}Object.entries(fields).forEach(([k,v])=>{if(E[k]) add(E[k],v);});add('pageHistory','0');document.body.appendChild(form);HTMLFormElement.prototype.submit.call(form);}
document.getElementById('send').addEventListener('click',()=>{
  const now=new Date().toISOString();
  const payload={backendVersion:'v13-google-form-compact-safe',source:'github-html-assessment-v13-google-form-compact-test',moduleSlug:'test',module:'Compact Test',attemptId:'test-'+Date.now(),submittedAt:now,profile:{amName:'Test User',cohort:'Test Wave',trainer:'Test Trainer',attemptDate:now.slice(0,10)},score:99,passingThreshold:80,passed:true,criticalFlags:[],breakdown:[{tag:'Test',pct:100}],answers:[{questionNumber:1,questionCode:'TST',section:'Test',question:'Compact test question',selectedAnswer:'A',expectedAnswer:'A',status:'Correct',creditPercent:100,feedback:'',tags:['Test'],critical:false}]};
  const chunks=chunkText(JSON.stringify(payload),950,12);
  const fields={backendVersion:'v13-google-form-compact-safe',securityToken:'DD-AM-TRAINING-V9',attemptId:payload.attemptId,source:payload.source,moduleSlug:payload.moduleSlug,module:payload.module,amName:payload.profile.amName,cohort:payload.profile.cohort,trainer:payload.profile.trainer,assessmentDate:payload.profile.attemptDate,submittedAt:payload.submittedAt,score:String(payload.score),passingThreshold:'80',passed:'true',criticalFlagsCount:'0',scoreBand:'Test',strongAreas:'Test 100%',focusAreas:'None'};
  for(let i=1;i<=12;i++){fields['payloadChunk'+String(i).padStart(2,'0')]=chunks[i-1]||' ';}
  post(fields);
});
</script></body></html>
